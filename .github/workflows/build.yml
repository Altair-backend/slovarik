name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # Публикуем APK (если собрался) и журнал сборки как релиз, чтобы их можно было скачать по ссылке
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          touch build.log
          grep -nE "^e: |^w: .*deprecat|error:|FAILED|What went wrong|Caused by|\[ksp\]|\[Hilt\]" -A4 build.log | head -c 200000 > errors.txt || true
          FILES="build.log errors.txt"
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" Slovarik.apk
            FILES="$FILES Slovarik.apk"
          fi
          gh release create "$TAG" $FILES --title "Сборка ${{ github.run_number }}" --notes "Автоматическая сборка" --target "${{ github.sha }}"
