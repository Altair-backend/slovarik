name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # Кладём APK (если собрался) и журнал сборки в отдельную ветку apk
      - name: Publish to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          touch build.log
          cp build.log out/
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then cp "$APK" out/Slovarik.apk; fi
          cd out
          git init -q -b apk
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Сборка ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk

      # И дополнительно публикуем как релиз, чтобы APK можно было скачать по ссылке
      - name: Publish release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="out/build.log"
          if [ -f out/Slovarik.apk ]; then FILES="$FILES out/Slovarik.apk"; fi
          gh release create "$TAG" $FILES --title "Build ${{ github.run_number }}" --notes "Automatic build" --target "${{ github.sha }}"
